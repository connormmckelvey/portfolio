[build]
  functions = "netlify/functions"

[[redirects]]
  from = "/api/admin/login"
  to = "/.netlify/functions/admin-login"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/session"
  to = "/.netlify/functions/admin-session"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/logout"
  to = "/.netlify/functions/admin-logout"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/publish"
  to = "/.netlify/functions/admin-publish"
  status = 200
  force = true